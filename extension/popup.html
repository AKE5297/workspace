<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <style>
      body { width: 340px; padding: 14px; font-family: system-ui, sans-serif; margin: 0; }
      h3 { margin: 0 0 10px; font-size: 15px; }
      input, textarea { width: 100%; box-sizing: border-box; padding: 6px 8px; border: 1px solid #dcdfe6; border-radius: 4px; margin-bottom: 8px; font-size: 13px; }
      textarea { min-height: 80px; resize: vertical; }
      select { width: 100%; padding: 6px; border: 1px solid #dcdfe6; border-radius: 4px; margin-bottom: 8px; }
      button { width: 100%; padding: 8px; border: none; border-radius: 4px; background: #409eff; color: #fff; font-size: 14px; cursor: pointer; }
      button:disabled { opacity: 0.5; }
      .status { margin-top: 8px; font-size: 12px; color: #67c23a; }
      .status.error { color: #f56c6c; }
    </style>
  </head>
  <body>
    <h3>保存到 Web Clipper</h3>
    <input id="server" placeholder="服务器地址，如 http://localhost:3001" />
    <input id="token" placeholder="API Token" type="password" />
    <input id="title" placeholder="标题（默认使用页面标题）" />
    <textarea id="text" placeholder="剪藏内容（默认提取正文）"></textarea>
    <select id="notebook">
      <option value="">未分类</option>
    </select>
    <button id="save">保存剪藏</button>
    <div id="status" class="status"></div>
    <script src="popup.js"></script>
  </body>
</html>
