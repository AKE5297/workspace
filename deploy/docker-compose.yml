services:
  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: web-clipper:latest
    container_name: web-clipper
    init: true
    ports:
      - "${HTTP_PORT:-80}:80"
    environment:
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - DATA_DIR=/app/backend/data
      # 用于生成分享链接 / RSS 的公开访问地址，按实际域名填写
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-http://localhost}
      # 前后端分离部署时限制跨域来源，多个用逗号分隔；同源部署保持默认 *
      - CORS_ORIGIN=${CORS_ORIGIN:-*}
      - USER_LLM_API_KEY=${USER_LLM_API_KEY:-}
      - USER_LLM_BASE_URL=${USER_LLM_BASE_URL:-https://api.deepseek.com/v1}
      - USER_LLM_MODEL=${USER_LLM_MODEL:-deepseek-chat}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-465}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-}
    volumes:
      - wc_data:/app/backend/data
    restart: unless-stopped
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  wc_data:
